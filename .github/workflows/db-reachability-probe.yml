name: DB reachability probe

# 일회성 진단 — 확인 후 삭제한다.
#
# 물음: "우리가 API를 만들면 BriconLab DB에 연동되는가?"
# 그 답의 유일한 미확인 전제는 **클라우드 호스트에서 그 DB 포트로 나가는 연결이
# 되는가**이다. DB 계정은 `youngbrain85@%`(호스트 와일드카드)라 MariaDB 쪽 제약은
# 없고, 남은 변수는 시놀로지 NAS/라우터의 방화벽이 소스 IP를 제한하는지뿐이다.
#
# 자격증명은 쓰지 않는다. MariaDB는 접속 직후 서버 핸드셰이크를 먼저 보내므로,
# TCP 연결 + 첫 패킷만으로 "열려 있고 MariaDB가 응답한다"를 확인할 수 있다.
# 개발자 PC(가정/사무실 IP)가 아닌 데이터센터에서 되면, IP 화이트리스트가
# 아니라는 뜻이다.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: TCP + MariaDB handshake probe
        run: |
          python3 - <<'PY'
          import socket, sys, time

          HOST, PORT = "briconlab.synology.me", 58807
          print(f"runner 공인 IP 확인용 — 대상 {HOST}:{PORT}")
          try:
              ip = socket.gethostbyname(HOST)
              print(f"DNS: {HOST} -> {ip}")
          except Exception as e:
              print(f"DNS 실패: {e}"); sys.exit(1)

          t0 = time.time()
          try:
              s = socket.create_connection((ip, PORT), timeout=15)
          except Exception as e:
              print(f"TCP 연결 실패 ({time.time()-t0:.1f}s): {type(e).__name__}: {e}")
              print("→ 데이터센터 IP에서는 닿지 않는다. 방화벽이 소스 IP를 제한하고 있을 가능성.")
              sys.exit(2)

          print(f"TCP 연결 성공 ({time.time()-t0:.1f}s)")
          s.settimeout(10)
          try:
              greeting = s.recv(256)
          except Exception as e:
              print(f"핸드셰이크 수신 실패: {e}"); s.close(); sys.exit(3)
          s.close()

          # MySQL/MariaDB 핸드셰이크: [3바이트 길이][시퀀스=0][프로토콜 버전=10][서버버전 NUL종료]
          if len(greeting) > 5 and greeting[4] == 10:
              ver = greeting[5:].split(b"\x00", 1)[0].decode("utf-8", "replace")
              print(f"서버 핸드셰이크 수신 — 버전 문자열: {ver}")
              print("→ 클라우드에서 DB에 도달 가능. IP 화이트리스트가 아니다.")
          else:
              print(f"예상과 다른 첫 패킷({len(greeting)}바이트): {greeting[:40]!r}")
              print("→ 포트는 열려 있으나 MariaDB 핸드셰이크가 아니다(프록시/필터 가능성).")
          PY

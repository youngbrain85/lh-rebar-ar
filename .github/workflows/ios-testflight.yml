name: iOS TestFlight

# Build the research and/or LH iOS app on a macOS runner, and optionally upload
# to TestFlight, so a release can happen without a local Mac (e.g. from Windows).
# Controlled by two workflow_dispatch inputs — `app` (research/lh/both, default
# research) and `upload` (true/false, default false) — so a no-arg dispatch only
# builds the research app and does NOT upload. Trigger it from the GitHub Actions
# tab ("Run workflow") or with
#   gh workflow run ios-testflight.yml -f app=<research|lh|both> -f upload=<true|false>
#
# Requires these repository secrets (see CLAUDE.md → CI):
#   ASC_KEY_ID            App Store Connect API key ID (Admin access — needed
#                         for cloud signing, not just the upload-only key)
#   ASC_ISSUER_ID         ASC API issuer ID
#   ASC_API_KEY_P8        the key's .p8 file contents
#   LIVESHARE_CONFIG_SWIFT  contents of LHRebarAR/Services/LiveShareConfig.swift
#                           (gitignored, required to compile)

on:
  workflow_dispatch:
    inputs:
      app:
        description: "빌드할 앱"
        required: true
        default: "research"
        type: choice
        options: [research, lh, both]
      upload:
        description: "TestFlight에 업로드 (끄면 빌드만)"
        required: true
        default: "false"
        type: choice
        options: ["true", "false"]

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.app }})
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: research
            scheme: LHRebarAR
            bundle: kr.lh.rebar-ar
            plist: LHRebarAR/Info.plist
          - app: lh
            scheme: LHRebarARLH
            bundle: kr.lh.rebar-lh
            plist: LHRebarAR/Info-LH.plist
    steps:
      # jobs.<job_id>.if 는 matrix 컨텍스트를 못 본다(매트릭스 전개 이전에 평가됨) —
      # GitHub이 워크플로 검증 단계에서 "Unrecognized named-value: 'matrix'"로 거부한다.
      # 그래서 건너뛰기 조건은 잡이 아니라 각 스텝에 건다.
      - uses: actions/checkout@v4
        if: ${{ github.event.inputs.app == 'both' || github.event.inputs.app == matrix.app }}

      - name: Select newest Xcode
        if: ${{ github.event.inputs.app == 'both' || github.event.inputs.app == matrix.app }}
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)" || true
          xcodebuild -version

      - name: Install tools
        if: ${{ github.event.inputs.app == 'both' || github.event.inputs.app == matrix.app }}
        run: |
          brew install xcodegen
          python3 -m pip install --break-system-packages pyjwt || python3 -m pip install pyjwt

      - name: Restore gitignored secrets
        if: ${{ github.event.inputs.app == 'both' || github.event.inputs.app == matrix.app }}
        env:
          LIVESHARE_CONFIG_SWIFT: ${{ secrets.LIVESHARE_CONFIG_SWIFT }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$LIVESHARE_CONFIG_SWIFT" > LHRebarAR/Services/LiveShareConfig.swift
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_API_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Generate Xcode project
        if: ${{ github.event.inputs.app == 'both' || github.event.inputs.app == matrix.app }}
        run: xcodegen generate

      - name: Compute next build number
        if: ${{ github.event.inputs.app == 'both' || github.event.inputs.app == matrix.app }}
        id: bump
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: ${{ matrix.bundle }}
        run: |
          set -euo pipefail
          N="$(python3 scripts/next_build.py)"
          echo "Next build number: $N"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $N" ${{ matrix.plist }}

      # 고정 배포 인증서를 키체인에 넣는다 — 이게 있으면 Xcode가 **새 인증서를
      # 만들지 않는다**.
      #
      # 왜 필요한가: `-allowProvisioningUpdates` 클라우드 서명은 러너 키체인이 비어
      # 있으면 Apple에 배포 인증서를 새로 요청한다. 러너는 매 실행 새 머신이라
      # 키체인이 항상 비어 있고, Apple의 배포 인증서 한도는 2~3개다. 그래서 한두 번
      # 빌드할 때마다 "Choose a certificate to revoke. Your account has reached the
      # maximum number of certificates."로 아카이브가 죽었다. 사람이 포털에서 계속
      # 폐기해 주는 것 말고는 방법이 없었다.
      #
      # 인증서는 `scripts/asc_cert.py create`로 만든다(Mac 없이 Windows에서 가능).
      # 시크릿이 없으면 이 스텝은 통째로 건너뛰고 기존 클라우드 서명으로 동작한다.
      - name: Import distribution certificate
        if: ${{ secrets.IOS_DIST_CERT_P12 != '' && (github.event.inputs.app == 'both' || github.event.inputs.app == matrix.app) }}
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"

          # codesign이 프롬프트 없이 개인키를 쓰게 한다 (없으면 아카이브가 조용히 멈춘다)
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # 새 키체인을 검색 목록 맨 앞에 둔다 — 기존 목록을 지우면 시스템 루트 CA가
          # 빠져 서명 검증이 실패하므로 반드시 앞에 "추가"한다
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed 's/[",]//g')

          echo "키체인의 서명 인증서:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # 서명 없이 시뮬레이터용으로 한 번 컴파일한다. Archive는 클라우드 서명을
      # 먼저 하므로 Apple 계정의 인증서 한도에 걸리면 **Swift가 한 줄도 컴파일되기
      # 전에** 실패한다 — 그러면 "코드가 빌드되는가"를 CI로 확인할 방법이 없다.
      # 이 단계는 인증서와 무관하므로 서명 문제와 컴파일 오류를 분리해 준다.
      - name: Compile check (no signing)
        if: ${{ github.event.inputs.app == 'both' || github.event.inputs.app == matrix.app }}
        run: |
          set -euo pipefail
          xcodebuild build \
            -project LHRebarAR.xcodeproj -scheme ${{ matrix.scheme }} \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd-${{ matrix.scheme }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Archive
        if: ${{ github.event.inputs.app == 'both' || github.event.inputs.app == matrix.app }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project LHRebarAR.xcodeproj -scheme ${{ matrix.scheme }} \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/${{ matrix.scheme }}.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Export IPA
        if: ${{ github.event.inputs.app == 'both' || github.event.inputs.app == matrix.app }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath build/${{ matrix.scheme }}.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        if: ${{ (github.event.inputs.app == 'both' || github.event.inputs.app == matrix.app) && github.event.inputs.upload == 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app --type ios \
            --file build/export/${{ matrix.scheme }}.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

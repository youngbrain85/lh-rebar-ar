name: LHRebarAR
options:
  bundleIdPrefix: kr.lh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_BITCODE: NO
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES

packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    from: "2.0.0"

targets:
  LHRebarAR:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    dependencies:
      - package: LiveKit
    sources:
      - path: LHRebarAR/App
      - path: LHRebarAR/AR
        optional: true
      - path: LHRebarAR/Placement
        optional: true
      - path: LHRebarAR/Measurement
        optional: true
      - path: LHRebarAR/Backend
        optional: true
      - path: LHRebarAR/Model
        optional: true
      - path: LHRebarAR/UI
        optional: true
      - path: LHRebarAR/Services
        optional: true
      - path: LHRebarAR/Resources/Assets.xcassets
        buildPhase: resources
      - path: LHRebarAR/Resources/Models
        type: folder
        buildPhase: resources
    info:
      path: LHRebarAR/Info.plist
      properties:
        # 발주처 요청으로 앱을 둘로 나누면서 표시명도 승인된 스펙값으로 맞춘다
        # (LHRebarARLH 타겟 설명 참조). 번들 ID·서명·TestFlight 이력에는 영향 없음.
        CFBundleDisplayName: 철근 AR 연구
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "32"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        NSCameraUsageDescription: "철근 모델을 현장에 증강 표시하기 위해 카메라가 필요합니다."
        NSPhotoLibraryAddUsageDescription: "측정 결과 화면을 사진에 저장하기 위해 사진 접근이 필요합니다."
        NSMicrophoneUsageDescription: "오피스와 실시간 협업(음성) 시 마이크가 필요합니다."
        ITSAppUsesNonExemptEncryption: false
        # BriconLab API is served over plain HTTP on a custom port; scope the
        # ATS exception to that domain only (not a blanket arbitrary-loads).
        NSAppTransportSecurity:
          NSExceptionDomains:
            api.briconlab.com:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
        # No `arkit` UIRequiredDeviceCapabilities: visionOS rejects that key
        # (ITMS-90984). LiDAR support is gated more strictly at runtime via
        # ARSessionManager.isLiDARSupported → UnsupportedDeviceView.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.lh.rebar-ar
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: G88CPAZ3MP
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "32"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - LHRebarARTests

  # LH 전용 앱 — 발주처 요청으로 연구과제 앱과 분리 개발 (docs 참조:
  # AR 앱 등 요청사항_260803.pdf). 소스는 LHRebarAR와 완전히 동일하게 전부 포함하고,
  # AppFeatures.swift의 LH_ONLY 플래그(SWIFT_ACTIVE_COMPILATION_CONDITIONS)만으로 화면
  # 노출을 가른다. xcodegen에는 타겟 상속이 없으므로 아래는 의도적인 복제다.
  LHRebarARLH:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    dependencies:
      - package: LiveKit
    sources:
      - path: LHRebarAR/App
      - path: LHRebarAR/AR
        optional: true
      - path: LHRebarAR/Placement
        optional: true
      - path: LHRebarAR/Measurement
        optional: true
      - path: LHRebarAR/Backend
        optional: true
      - path: LHRebarAR/Model
        optional: true
      - path: LHRebarAR/UI
        optional: true
      - path: LHRebarAR/Services
        optional: true
      - path: LHRebarAR/Resources/Assets.xcassets
        buildPhase: resources
      - path: LHRebarAR/Resources/Models
        type: folder
        buildPhase: resources
    info:
      # info: 는 입력이 아니라 xcodegen이 plist를 생성하는 출력 경로다. 두 타겟이 한
      # 경로를 공유하면 나중에 처리되는 쪽이 덮어써서 표시명·빌드번호가 순서에
      # 좌우된다(CFBundleDisplayName/CFBundleVersion은 빌드 변수 치환이 아니라
      # 리터럴 값으로 굳는다). 새 디렉터리를 만들지 않고 기존 LHRebarAR/ 안에 두는
      # 이유는 그 디렉터리가 이미 존재하고(생성 실패 위험이 없다) 기존
      # LHRebarAR/Info.plist와 같은 추적 관례에 놓이기 때문. LHRebarAR/는 sources
      # 경로가 아니므로(소스는 LHRebarAR/App, /AR, … 하위만) 빌드 페이즈에 딸려
      # 들어가지 않는다.
      path: LHRebarAR/Info-LH.plist
      properties:
        CFBundleDisplayName: LH 철근검측
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        NSCameraUsageDescription: "철근 모델을 현장에 증강 표시하기 위해 카메라가 필요합니다."
        NSPhotoLibraryAddUsageDescription: "측정 결과 화면을 사진에 저장하기 위해 사진 접근이 필요합니다."
        NSMicrophoneUsageDescription: "오피스와 실시간 협업(음성) 시 마이크가 필요합니다."
        ITSAppUsesNonExemptEncryption: false
        # BriconLab API is served over plain HTTP on a custom port; scope the
        # ATS exception to that domain only (not a blanket arbitrary-loads).
        NSAppTransportSecurity:
          NSExceptionDomains:
            api.briconlab.com:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
        # No `arkit` UIRequiredDeviceCapabilities: visionOS rejects that key
        # (ITMS-90984). LiDAR support is gated more strictly at runtime via
        # ARSessionManager.isLiDARSupported → UnsupportedDeviceView.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.lh.rebar-lh
        TARGETED_DEVICE_FAMILY: "1,2"
        # 앱이 둘로 나뉘었는데 아이콘이 같아 홈 화면에서 구분이 안 됐다.
        # 60px에서는 글자가 안 읽히므로 바탕색으로 가른다 — 연구과제는
        # 차콜, LH 전용은 주황. 아이콘 생성은 scripts/make_app_icons.py.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconLH
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: G88CPAZ3MP
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LH_ONLY"
    scheme:
      testTargets:
        - LHRebarARTests

  # 호스트 없는 순수 로직 테스트. 앱을 빌드하지 않으므로 LiveKit 도 안 끌어온다.
  # 여기 넣는 소스는 `import Foundation` 만 하는 파일로 제한한다 — ARKit/SwiftUI 가
  # 딸려 오면 호스트 없는 번들이 깨진다.
  #
  # info: 를 명시하는 이유 — xcodegen 소스(PBXProjGenerator.getInfoPlists)는
  # INFOPLIST_FILE을 이 순서로만 정한다: ①명시적 빌드 세팅 ②이 info: 블록
  # ③sources 안에서 파일명이 "Info.plist"인 파일 검색. 셋 다 없으면 그냥 비워
  # 둔다 — GENERATE_INFOPLIST_FILE을 대신 켜주지 않는다(소스에 그런 로직이
  # 없음, 2026-08-19 GitHub에서 직접 확인). 이 타겟은 sources에 실제
  # Info.plist가 없으므로 ③도 안 걸려 지금까지 완전히 빈 채였다 — 리뷰에서
  # 지적된 위험 그대로. 이 머신엔 Xcode가 없어 xcodebuild로 실증할 수는
  # 없었다(XcodeGen 자체 테스트 픽스처는 info: 없이도 bundle.unit-test가
  # 동작하는 걸로 보아 Info.plist 자체가 없어도 XCTest가 별문제 없이 도는
  # 걸로 보이지만, 이것도 소스 추적이 아니라 정황 증거다). 확신이 없으므로
  # 위험을 코드로 없앤다 — 경로는 LHRebarAR/ 바로 밑(104행 LHRebarARLH
  # 주석과 같은 이유로 어느 타겟의 sources 스캔 범위에도 안 걸린다).
  LHRebarARTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    info:
      path: LHRebarAR/Info-Tests.plist
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
    sources:
      - path: LHRebarAR/Model/RebarTaxonomy.swift
      - path: LHRebarAR/Backend/RebarMetaFile.swift
      - path: LHRebarAR/Backend/BackendDTOs.swift
      - path: LHRebarARTests
